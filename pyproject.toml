[project]
name = "lang-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oleksandr Ovcharenko", email = "oleksandr.ovcharenko@vista.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.4",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "python-dotenv>=1.2.4",
]

[project.scripts]
lang-course = "lang_course:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
